services:
  server:
    build: ./packages/server
    ports:
      - "3300:3300"
    environment:
      - DATABASE_URL=file:/data/work-tracker.db
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      - BETTER_AUTH_BASE_URL=${BETTER_AUTH_BASE_URL:-http://localhost:3300}
      - PORT=${PORT:-3300}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8080}
      # Passkey / WebAuthn configuration
      # RP ID must match the domain the app is served from (no port, no scheme)
      - PASSKEY_RP_ID=${PASSKEY_RP_ID:-localhost}
      - PASSKEY_RP_NAME=${PASSKEY_RP_NAME:-Work Tracker}
    volumes:
      - db-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3300/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  web:
    build:
      context: ./packages/web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3300}
    ports:
      - "8800:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  db-data:
