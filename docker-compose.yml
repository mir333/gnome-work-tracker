services:
  server:
    build: ./packages/server
    ports:
      - "3300:3300"
    environment:
      - DATABASE_URL=file:/data/work-tracker.db
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      - BETTER_AUTH_BASE_URL=${BETTER_AUTH_BASE_URL:-http://localhost:3300}
      - PORT=${PORT:-3300}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:8080}
    volumes:
      - db-data:/data
    restart: unless-stopped

  web:
    build:
      context: ./packages/web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3300}
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  db-data:
